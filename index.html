<title>أحمد حماد سكوتر | كفر الدوار</title>
<meta name="description" content="أحمد حماد سكوتر، وكيل معتمد لـ SYM وTVS وHAOJIN في كفر الدوار. قطع غيار وصيانة.">

<link href="https://fonts.googleapis.com/css2?family=Changa:wght@700;800&family=IBM+Plex+Sans+Arabic:wght@400;600;700&family=Montserrat:ital,wght@1,800&display=swap" rel="stylesheet">
<style>
:root{--bg:#07080c;--fade:7,8,12;--card:#10131a;--line:#252a35;--line2:#3a4150;--ink:#f4f5f8;--muted:#98a0ae;--brand:#e10600;--hot:#ff3b30;--accent:#4cc9ff;--bluebg:linear-gradient(180deg,#0f1c29,#09111a);--solid:#11141b;--callbg:#0b0c10;--outline:rgba(255,255,255,.2);--soc:#0c0e13;--copy:#e9edf5;--copyink:#10131a;--toastbg:#fff;--toastink:#10131a;--noise:.08;color-scheme:dark}
html[data-theme="light"]{--bg:#f1f3f7;--fade:241,243,247;--card:#fff;--line:#dde1e9;--line2:#c4cad6;--ink:#12151c;--muted:#596273;--hot:#d70f00;--accent:#0a7fc2;--bluebg:linear-gradient(180deg,#eaf6fd,#fff);--solid:#fff;--callbg:#fff;--outline:rgba(0,0,0,.14);--soc:#fff;--copy:#1b1f27;--copyink:#fff;--toastbg:#12151c;--toastink:#fff;--noise:.05;color-scheme:light}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic",Tahoma,Arial,sans-serif;line-height:1.6}
.wrap{position:relative;max-width:480px;min-height:100vh;margin:0 auto;background:var(--bg);padding-bottom:calc(36px + env(safe-area-inset-bottom,0px));overflow:hidden}
.wrap::before{content:"";position:absolute;inset:0;z-index:5;pointer-events:none;opacity:var(--noise);background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.hero{height:400px;position:relative;background:#000 center/cover no-repeat}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(7,8,12,.4),rgba(7,8,12,0) 30%,rgba(var(--fade),.5) 68%,var(--bg))}
.id{position:relative;z-index:1;text-align:center;margin:-72px 20px 30px}
.logo{width:108px;height:108px;border-radius:50%;margin:0 auto 12px;border:4px solid var(--bg);background:var(--brand);box-shadow:0 0 0 2px var(--brand),0 0 30px rgba(225,6,0,.6);overflow:hidden;display:grid;place-items:center;font-size:42px;font-weight:700}
.logo.has-img{background:transparent}
.logo img{width:100%;height:100%;object-fit:cover}
h1{font-family:Changa,"IBM Plex Sans Arabic",sans-serif;font-size:2.1rem;font-weight:800;line-height:1.15}
.en{font-family:Montserrat,Arial,sans-serif;font-style:italic;font-weight:800;font-size:.78rem;letter-spacing:.18em;color:var(--hot);margin-top:6px}
.en::after{content:"";display:block;width:130px;height:2px;margin:14px auto 0;background:linear-gradient(90deg,transparent,var(--hot),var(--accent),transparent);box-shadow:0 0 12px rgba(255,59,48,.7)}
.desc{color:var(--muted);font-size:.98rem;margin-top:12px}
.desc:empty{display:none}
.chips{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:8px;margin-top:12px}
.chips .lead{font-size:.85rem;color:var(--muted)}
.chips .br{flex-basis:100%;height:0}
.chip{font-size:.8rem;font-weight:600;padding:5px 14px;border-radius:999px;border:1px solid var(--line2);background:var(--card);color:var(--ink)}
.chip.brand{font-family:Montserrat,Arial,sans-serif;font-style:italic;font-weight:800;letter-spacing:.08em;border-color:var(--hot);color:var(--hot);box-shadow:0 0 12px rgba(255,59,48,.25)}
.list{position:relative;z-index:1;display:grid;gap:14px;padding:0 20px}
.tile{position:relative;display:flex;align-items:center;gap:14px;width:100%;color:var(--ink);text-decoration:none;font:inherit;text-align:start;cursor:pointer;border:2px solid transparent;padding:14px 18px;overflow:hidden;transition:transform .15s,filter .15s}
.tile:active{transform:scale(.985)}
.ic{flex:none;width:48px;height:48px;display:grid;place-items:center}
.ic svg{width:24px;height:24px}
.t b{display:block;font-family:Changa,"IBM Plex Sans Arabic",sans-serif;font-weight:700;font-size:1.15rem;line-height:1.3}
.t span{display:block;font-size:.82rem;color:var(--muted)}
.t bdi{direction:ltr;unicode-bidi:isolate}
.chev{margin-inline-start:auto;width:20px;height:20px;color:var(--muted);flex:none;transition:transform .2s}
.tile[aria-expanded="true"] .chev{transform:rotate(-90deg)}

.tile.main{padding:22px 18px;border-radius:32px 8px 32px 8px;border-color:rgba(255,255,255,.2);background:linear-gradient(135deg,#ff2a1f 0%,#c40500 55%,#760000 100%);box-shadow:0 0 0 1px rgba(255,59,48,.5),0 10px 32px rgba(225,6,0,.55),inset 0 1px 0 rgba(255,255,255,.4),inset 0 -16px 26px rgba(0,0,0,.28)}
.main .ic{border-radius:50%;background:#fff;color:var(--brand);box-shadow:0 0 18px rgba(255,255,255,.55)}
.main .t b{font-size:1.3rem;text-shadow:0 2px 10px rgba(0,0,0,.35)}
.main .t span{color:rgba(255,255,255,.88)}
.main .chev{color:#fff}
.main::after{content:"";position:absolute;top:-30%;bottom:-30%;left:-90px;width:50px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.4),transparent);transform:skewX(-20deg);pointer-events:none}

.tile.blue{border-radius:999px;padding-inline:14px 22px;border-color:var(--accent);background:var(--bluebg);box-shadow:0 0 0 4px rgba(76,201,255,.1),0 0 26px rgba(76,201,255,.38),inset 0 0 22px rgba(76,201,255,.15)}
.blue .ic{background:linear-gradient(145deg,#9be5ff,#2a8fd0);color:#04202f;clip-path:polygon(25% 4%,75% 4%,100% 50%,75% 96%,25% 96%,0 50%)}
.blue .t b{text-shadow:0 0 14px rgba(76,201,255,.7)}

.tile.chrome{border-radius:6px;border:2px solid transparent;background:linear-gradient(var(--solid),var(--solid)) padding-box,linear-gradient(135deg,#fff 0%,#7d8696 30%,#e9edf5 55%,#566070 100%) border-box;box-shadow:0 0 24px rgba(255,255,255,.12),inset 0 0 18px rgba(255,255,255,.05);outline:1px solid var(--outline);outline-offset:4px}
.chrome .ic{border-radius:10px;background:linear-gradient(145deg,#fff,#8b94a5);color:#10131a}

.tile.call{border-radius:8px 32px 8px 32px;border-color:var(--hot);background:var(--callbg);box-shadow:0 0 0 4px rgba(255,59,48,.1),0 0 26px rgba(255,59,48,.38),inset 0 0 22px rgba(255,59,48,.14)}
.call .ic{border-radius:50%;border:2px solid var(--hot);color:var(--hot);box-shadow:0 0 16px rgba(255,59,48,.55)}
.call .t b{text-shadow:0 0 14px rgba(255,59,48,.8)}

.tile.loc{border-radius:18px;border-color:var(--line2);background:var(--card)}
.loc .ic{border-radius:50%;background:linear-gradient(145deg,var(--hot),#8b0500);color:#fff}
.panel{margin-top:-4px;background:var(--card);border:1px solid var(--line2);border-radius:6px;padding:6px 18px}
.panel[hidden]{display:none}
.w{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.w:last-child{border-bottom:0}
.w b{display:block;font-weight:600;font-size:.95rem}
.w bdi{display:block;direction:ltr;text-align:right;color:var(--muted);font-size:.9rem;font-variant-numeric:tabular-nums}
.owner{font-size:.82rem;color:var(--muted);padding:10px 0 4px}
button.copy{flex:none;font:inherit;font-size:.85rem;font-weight:600;border:1.5px solid var(--copy);background:transparent;color:var(--copy);border-radius:999px;padding:7px 16px;min-width:104px;cursor:pointer}
button.copy.done{background:var(--copy);color:var(--copyink)}

.soc{position:relative;z-index:1;display:flex;justify-content:center;gap:10px;margin-top:34px;padding:0 18px;filter:drop-shadow(0 0 7px rgba(255,59,48,.45))}
.soc a{position:relative;width:56px;height:62px;display:grid;place-items:center;color:var(--ink);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:linear-gradient(160deg,var(--hot),var(--accent))}
.soc a::before{content:"";position:absolute;inset:2px;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:var(--soc);transition:background .2s}
.soc svg{position:relative;width:22px;height:22px}
a:focus-visible,button:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
@media(hover:hover){.tile:hover{filter:brightness(1.14)}.soc a:hover::before{background:var(--brand)}}
@media(prefers-reduced-motion:no-preference){
@keyframes flick{0%{box-shadow:0 0 0 2px var(--brand)}8%{box-shadow:0 0 0 2px var(--brand),0 0 38px rgba(76,201,255,.95)}14%{box-shadow:0 0 0 2px var(--brand)}22%{box-shadow:0 0 0 2px var(--brand),0 0 38px rgba(76,201,255,.85)}32%,100%{box-shadow:0 0 0 2px var(--brand),0 0 30px rgba(225,6,0,.6)}}
@keyframes sweep{to{left:115%}}
.logo{animation:flick 1.1s .25s both}
.main::after{animation:sweep .9s 1.3s ease-in both}}
@media(prefers-reduced-motion:reduce){.chev,.tile{transition:none}}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;z-index:10;background:var(--toastbg);color:var(--toastink);font-weight:700;padding:12px 24px;border-radius:999px;white-space:nowrap;box-shadow:0 8px 30px rgba(0,0,0,.55),0 0 22px rgba(76,201,255,.55);transition:opacity .2s,transform .2s}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){.toast{transition:none}}
.theme{position:absolute;z-index:10;top:calc(14px + env(safe-area-inset-top,0px));inset-inline-end:14px;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;border:1px solid rgba(255,255,255,.3);background:rgba(7,8,12,.5);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);color:#fff;cursor:pointer;box-shadow:0 0 18px rgba(76,201,255,.35)}
.theme svg{width:22px;height:22px}
.theme:focus-visible{outline-color:#fff}
html[data-theme="light"] .blue .t b,html[data-theme="light"] .call .t b{text-shadow:none}
footer{display:none}

/* زر طلب Tapio عبر واتساب */
.order-stand-bar{position:fixed;z-index:20;left:50%;bottom:0;transform:translateX(-50%);width:min(100%,480px);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(12px);border-top:1px solid var(--line);}
.order-stand-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:54px;padding:12px 16px;border-radius:16px;background:#20b85a;color:#fff;text-decoration:none;font-weight:800;font-size:16px;box-shadow:0 8px 24px rgba(32,184,90,.25);transition:transform .15s ease,filter .15s ease;}
.order-stand-btn:hover{filter:brightness(1.04)}.order-stand-btn:active{transform:scale(.985)}
.order-stand-btn svg{width:23px;height:23px;flex:none}
.wrap{padding-bottom:calc(110px + env(safe-area-inset-bottom,0px))}
@media(prefers-reduced-motion:reduce){.order-stand-btn{transition:none}}
</style>
</head>

const $ = id => document.getElementById(id);
const root = document.documentElement.style;
root.setProperty("--brand", CONFIG.brandColor);
root.setProperty("--accent", CONFIG.accentColor);

$("name").textContent = CONFIG.name;
$("tagline").textContent = CONFIG.tagline;
$("desc").textContent = CONFIG.desc;
$("chips").innerHTML =

  (CONFIG.services.length ? `<i class="br"></i>` + CONFIG.services.map(v => `<span class="chip">${v}</span>`).join("") : "");

  const img = document.createElement("img");
  img.src = CONFIG.logo; img.alt = CONFIG.name;
  $("logo").classList.add("has-img");
  $("logo").appendChild(img);
} else {
  $("logo").textContent = CONFIG.name.trim().charAt(0);
}

const tile = (tag, attrs, icon, title, sub, cls) =>
  `<${tag} class="tile ${cls || ""}" ${attrs}><span class="ic">${ICON[icon]}</span><span class="t"><b>${title}</b><span>${sub}</span></span>${ICON.chev}</${tag}>`;

const list = $("list");
let html = "";
if (CONFIG.reviewUrl)
  html += tile("a", `href="${CONFIG.reviewUrl}"`, "star", "قيّم تجربتك على جوجل", "رأيك بياخد دقيقة وبيفرق معانا", "main");
if (CONFIG.instapayUrl)
  html += tile("a", `href="${CONFIG.instapayUrl}" target="_blank" rel="noopener noreferrer"`, "card", "حوّل عبر إنستاباي", "اضغط هنا للتحويل مباشرة عبر إنستاباي", "blue");
if (CONFIG.wallets.length)
  html += tile("button", `type="button" id="wBtn" aria-expanded="false" aria-controls="wPanel"`, "wallet", "المحافظ الإلكترونية", CONFIG.wallets.map(w => w.label).join("، "), "chrome") +

    }</div>`;
if (CONFIG.mapsUrl)
  html += tile("a", `href="${CONFIG.mapsUrl}"`, "pin", "موقعنا على الخريطة", CONFIG.address, "loc");
if (CONFIG.phone)
  html += tile("a", `href="tel:${CONFIG.phone}"`, "phone", "اتصل بنا", `<bdi>${CONFIG.phoneLabel || CONFIG.phone}</bdi>`, "call");
list.innerHTML = html;

$("soc").innerHTML = CONFIG.socials.map(s =>
  `<a href="${s.url}" aria-label="${s.label}">${ICON[s.type] || ICON.link}</a>`).join("");

function legacyCopy(text) {
  return new Promise((ok, fail) => {
    const t = document.createElement("textarea");
    t.value = text; t.setAttribute("readonly", "");
    t.style.cssText = "position:fixed;top:0;left:0;opacity:0;font-size:16px";
    document.body.appendChild(t);
    t.focus(); t.select(); t.setSelectionRange(0, text.length);
    let done = false;
    try { done = document.execCommand("copy"); } catch (e) {}
    t.remove();
    done ? ok() : fail();
  });
}
function copyText(text) {
  if (navigator.clipboard && window.isSecureContext)
    return navigator.clipboard.writeText(text).catch(() => legacyCopy(text));
  return legacyCopy(text);
}
let toastTimer;
function toast(msg) {
  const t = $("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 2200);
}

const wBtn = $("wBtn");
if (wBtn) wBtn.onclick = () => {
  const open = wBtn.getAttribute("aria-expanded") === "true";
  wBtn.setAttribute("aria-expanded", String(!open));
  $("wPanel").hidden = open;
};
document.querySelectorAll("button.copy").forEach(btn => {
  btn.onclick = () => {
    const w = CONFIG.wallets[btn.dataset.i];
    copyText(w.value).then(() => {
      btn.textContent = "تم النسخ ✓"; btn.classList.add("done");
      toast("تم نسخ رقم " + w.label + " ✓");
      setTimeout(() => { btn.textContent = "نسخ"; btn.classList.remove("done"); }, 1800);
    }).catch(() => toast("اضغط مطولًا على الرقم لنسخه"));
  };
});

let theme = "dark";
try { theme = localStorage.getItem("theme") || "dark"; } catch (e) {}
function applyTheme(t) {
  theme = t;
  document.documentElement.dataset.theme = t;
  document.querySelector('meta[name="theme-color"]').content = t === "light" ? "#f1f3f7" : "#07080c";
  const b = $("themeBtn");
  b.innerHTML = t === "light" ? ICON.moon : ICON.sun;
  b.setAttribute("aria-label", t === "light" ? "تفعيل الوضع الداكن" : "تفعيل الوضع الفاتح");
}
applyTheme(theme);
$("themeBtn").onclick = () => {
  applyTheme(theme === "light" ? "dark" : "light");
  try { localStorage.setItem("theme", theme); } catch (e) {}
};
</script>
